name: Release Windows

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: folderbridge-release
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Release FolderBridge ')
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify release commit and project version
        shell: pwsh
        run: |
          $version = (& python -c "import pathlib,tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])").Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release version must be a stable numeric x.y.z version; got '$version'."
          }
          $firstLine = (($env:RELEASE_COMMIT_MESSAGE -split "`r?`n", 2)[0]).Trim()
          $expectedMessage = "Release FolderBridge $version"
          if ($firstLine -ne $expectedMessage) {
            throw "Release commit title must be exactly '$expectedMessage'; got '$firstLine'."
          }
          $tag = "v$version"
          "FOLDERBRIDGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FOLDERBRIDGE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify existing tag, if any, targets this commit
        shell: pwsh
        run: |
          $lines = @(git ls-remote --tags origin "refs/tags/$env:FOLDERBRIDGE_TAG" "refs/tags/$env:FOLDERBRIDGE_TAG^{}")
          if ($LASTEXITCODE -ne 0) {
            throw "Could not inspect remote release tag."
          }
          if ($lines.Count -gt 0) {
            $peeled = $lines | Where-Object { $_ -like "*refs/tags/$env:FOLDERBRIDGE_TAG^{}" } | Select-Object -First 1
            $target = if ($peeled) { ($peeled -split "`t", 2)[0] } else { (($lines | Select-Object -First 1) -split "`t", 2)[0] }
            if ($target -ne $env:GITHUB_SHA) {
              throw "Remote tag $env:FOLDERBRIDGE_TAG already exists at $target instead of release commit $env:GITHUB_SHA."
            }
            "FOLDERBRIDGE_TAG_EXISTS=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            "FOLDERBRIDGE_TAG_EXISTS=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

      - name: Install pinned build dependency
        run: python -m pip install -r requirements-build.txt

      - name: Run full regression suite
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build Windows x64 release
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Python python

      - name: Verify packaged executable again
        run: python scripts/verify_windows_bundle.py release/windows-x64/FolderBridge.exe

      - name: Verify public external Extension release assets
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem "release/external-extensions" -File | Sort-Object Name)
          if ($assets.Count -ne 18) {
            throw "Expected 18 external Extension Release files (9 ZIP + 9 SHA256); found $($assets.Count)."
          }
          if ($assets.Name -match 'debate-judge-adapter') {
            throw "Private Debate Judge adapter must never be published as a Release asset."
          }
          $zips = @($assets | Where-Object { $_.Name -like '*.zip' })
          $checksums = @($assets | Where-Object { $_.Name -like '*.zip.sha256' })
          if ($zips.Count -ne 9 -or $checksums.Count -ne 9) {
            throw "External Extension Release asset shape is incomplete."
          }
          foreach ($zip in $zips) {
            $checksumPath = "$($zip.FullName).sha256"
            $expected = ((Get-Content -LiteralPath $checksumPath -Raw -Encoding ascii) -split '\s+', 2)[0].Trim().ToLowerInvariant()
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip.FullName).Hash.ToLowerInvariant()
            if ($expected -ne $actual) {
              throw "External Extension Release checksum mismatch: $($zip.Name)"
            }
          }

      - name: Create and push release tag
        if: env.FOLDERBRIDGE_TAG_EXISTS == '0'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a $env:FOLDERBRIDGE_TAG -m "FolderBridge $env:FOLDERBRIDGE_VERSION" $env:GITHUB_SHA
          git push origin "refs/tags/$env:FOLDERBRIDGE_TAG:refs/tags/$env:FOLDERBRIDGE_TAG"

      - name: Create or repair GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "release/windows-x64/FolderBridge.exe",
            "release/windows-x64/FolderBridge.exe.sha256"
          ) + @(Get-ChildItem "release/external-extensions" -File | Sort-Object Name | ForEach-Object { $_.FullName })
          gh release view $env:FOLDERBRIDGE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $env:FOLDERBRIDGE_TAG @assets --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $env:FOLDERBRIDGE_TAG `
              --title "FolderBridge $env:FOLDERBRIDGE_VERSION" `
              --latest --repo $env:GITHUB_REPOSITORY
          } else {
            & gh release create $env:FOLDERBRIDGE_TAG @assets `
              --verify-tag `
              --generate-notes `
              --title "FolderBridge $env:FOLDERBRIDGE_VERSION" `
              --latest `
              --repo $env:GITHUB_REPOSITORY
          }
